<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrical RFP Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        /* Loader CSS */
        .loader {
            border-top-color: #3498db;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        function showLoading() {
            document.getElementById('loading-overlay').classList.remove('hidden');
        }
    </script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Loading Overlay -->
    <div id="loading-overlay"
        class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
            <h2 class="text-center text-gray-800 text-xl font-semibold">Analyzing RFP...</h2>
            <p class="text-center text-gray-500 text-sm mt-2">This may take a few moments</p>
        </div>
    </div>

    <!-- Navbar / Header -->
    <header class="w-full max-w-4xl mx-auto mb-8 text-center animate-fade-in-down">
        <div class="inline-flex items-center justify-center p-3 mb-4 rounded-full bg-blue-50 text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z">
                </path>
            </svg>
        </div>
        <h1 class="text-4xl font-bold text-gray-900 tracking-tight mb-2">Electrical RFP Analyzer</h1>
        <p class="text-lg text-gray-600">AI-Powered Electrical Bid Automation</p>
    </header>

    <!-- Main Upload Card -->
    <main class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">

        <!-- Header Strip -->
        <div class="h-2 bg-gradient-to-r from-blue-500 to-indigo-600 w-full"></div>

        <div class="p-8">
            {% if error %}
            <div class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-md">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm text-red-700 font-medium">
                            {{ error }}
                        </p>
                    </div>
                </div>
            </div>
            {% endif %}

            <form method="post" enctype="multipart/form-data" class="space-y-6" onsubmit="showLoading()">
                {% csrf_token %}

                <!-- File Upload Section -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Upload RFP Document (PDF)</label>
                    <div
                        class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-xl hover:border-blue-500 transition-colors duration-200 bg-gray-50 hover:bg-white group cursor-pointer relative">
                        <div class="space-y-1 text-center">
                            <svg class="mx-auto h-12 w-12 text-gray-400 group-hover:text-blue-500 transition-colors"
                                stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                                <path
                                    d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <div class="flex text-sm text-gray-600 justify-center">
                                <label for="file-upload"
                                    class="relative cursor-pointer rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none">
                                    <span>Upload a file</span>
                                    <input id="file-upload" name="rfp_file" type="file" class="sr-only">
                                </label>
                                <p class="pl-1">or drag and drop</p>
                            </div>
                            <p class="text-xs text-gray-500">PDF or TXT up to 10MB</p>
                        </div>
                    </div>
                </div>

                <!-- Divider -->
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500 font-medium">OR</span>
                    </div>
                </div>

                <!-- Text Area Section -->
                <div>
                    <label for="rfp_text" class="block text-sm font-semibold text-gray-700 mb-2">Paste RFP Text</label>
                    <div class="mt-1">
                        <textarea id="rfp_text" name="rfp_text" rows="6"
                            class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-xl p-3"
                            placeholder="Paste the content of the RFP here..."></textarea>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transform transition hover:-translate-y-0.5 transition-duration-200">
                        Analyze RFP Document
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer area of card -->
        <div class="bg-gray-50 px-8 py-4 border-t border-gray-100 flex justify-between items-center">
            <span class="text-xs text-gray-500">Secure & Confidential Processing</span>
            <span class="text-xs text-gray-500">v1.0.0</span>
        </div>
    </main>

    <script>
        // Simple script to show file name on selection
        const fileInput = document.getElementById('file-upload');
        fileInput.addEventListener('change', function (e) {
            const fileName = e.target.files[0].name;
            if (fileName) {
                // Find a place to display it or just update the label text
                const label = this.parentElement.querySelector('span');
                label.innerText = fileName;
                label.parentElement.parentElement.parentElement.classList.add('border-blue-500', 'bg-blue-50');
            }
        });
    </script>
</body>

</html>
